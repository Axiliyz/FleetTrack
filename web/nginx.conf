# Фронт и API с одного адреса: статика из /usr/share/nginx/html, /api/* — на Go-сервис.
# Один origin — значит, CORS не нужен, как и в dev-режиме с прокси Vite

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Токены лежат в sessionStorage, поэтому любой выполненный чужой скрипт - это кража сессии.
    # CSP оставляет скриптам только свой origin. Подложка карты грузится с basemaps.cartocdn.com
    # (стили, тайлы, шрифты), maplibre запускает воркер из blob:, стили у него инлайновые
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self' data: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Адрес api берём у DNS Docker при каждом запросе, а не один раз при старте:
    # контейнер api после перезапуска получает новый IP, и nginx со старым остался бы без бэка
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # поток событий: без буферизации и с долгим таймаутом, иначе nginx копит события и рвёт «молчащее» соединение.
    # Сервер шлёт heartbeat раз в 15 с, так что час тишины — уже обрыв
    location = /api/stream {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # настоящий адрес клиента, перезаписанный nginx (в отличие от X-Forwarded-For, его не подделать):
        # нужен лимиту попыток входа, иначе все посетители делят один лимит на адрес nginx
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кеш задаём через expires, а не add_header: свой add_header в location отменил бы
    # заголовки безопасности уровня server

    # файлы сборки с хешем в имени не меняются — кешируем надолго
    location /assets/ {
        expires 1y;
    }

    # SPA: любой адрес раздела отдаёт index.html, дальше маршрут разбирает роутер.
    # index.html не кешируем, чтобы после выкладки браузер сразу взял новые файлы
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
