basePath: /
definitions:
  dto.APIResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      status:
        type: string
    type: object
  dto.AlertResponse:
    properties:
      acknowledged_at:
        type: string
      acknowledged_by:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      message:
        type: string
      organization_id:
        type: integer
      resolved_at:
        type: string
      resolved_by:
        type: integer
      rule_id:
        type: integer
      severity:
        $ref: '#/definitions/model.SeverityLevel'
      status:
        $ref: '#/definitions/model.AlertStatus'
      type:
        $ref: '#/definitions/model.AlertRuleType'
      value:
        type: number
      vehicle_id:
        type: integer
    type: object
  dto.AlertRuleResponse:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      organization_id:
        type: integer
      severity:
        $ref: '#/definitions/model.SeverityLevel'
      threshold:
        type: number
      type:
        $ref: '#/definitions/model.AlertRuleType'
      updated_at:
        type: string
    type: object
  dto.AssignmentResponse:
    properties:
      device_id:
        type: integer
      ended_at:
        type: string
      id:
        type: integer
      started_at:
        type: string
      vehicle_id:
        type: integer
    type: object
  dto.CreateAlertRuleRequest:
    properties:
      enabled:
        type: boolean
      name:
        type: string
      severity:
        $ref: '#/definitions/model.SeverityLevel'
      threshold:
        type: number
      type:
        $ref: '#/definitions/model.AlertRuleType'
    type: object
  dto.CreateAssignmentRequest:
    properties:
      device_id:
        type: integer
      vehicle_id:
        type: integer
    type: object
  dto.CreateDeviceRequest:
    properties:
      serial_number:
        type: string
    type: object
  dto.CreateDriverRequest:
    properties:
      name:
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      driver_id:
        description: |-
          DriverID - водитель, к которому привязан аккаунт. Обязателен для роли DRIVER
          и запрещён для остальных; водитель должен быть из той же организации
        type: integer
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  dto.CreateVehicleRequest:
    properties:
      model:
        type: string
      number_plate:
        type: string
      vin:
        type: string
    type: object
  dto.DeletedCountResponse:
    properties:
      deleted:
        type: integer
    type: object
  dto.DeviceResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      organization_id:
        type: integer
      serial_number:
        type: string
      status:
        $ref: '#/definitions/model.DeviceStatus'
    type: object
  dto.DriverResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      organization_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      message:
        type: string
      request_id:
        type: string
      status:
        type: string
    type: object
  dto.FleetSnapshotResponse:
    properties:
      alerts:
        items:
          $ref: '#/definitions/dto.AlertResponse'
        type: array
      drivers:
        items:
          $ref: '#/definitions/dto.DriverResponse'
        type: array
      org:
        $ref: '#/definitions/dto.OrgResponse'
      positions:
        items:
          $ref: '#/definitions/dto.TelemetryResponse'
        type: array
      rules:
        items:
          $ref: '#/definitions/dto.AlertRuleResponse'
        type: array
      trips:
        items:
          $ref: '#/definitions/model.Trip'
        type: array
      vehicles:
        items:
          $ref: '#/definitions/dto.VehicleResponse'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.OrgResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterOrganizationRequest:
    properties:
      admin_email:
        type: string
      admin_name:
        type: string
      admin_password:
        type: string
      organization_name:
        type: string
    type: object
  dto.TelemetryRequest:
    properties:
      device_id:
        type: integer
      device_timestamp:
        description: |-
          DeviceTimestamp — время замера по часам терминала. Терминал копит точки, пока нет связи,
          и досылает их пачкой; скорость считается по этому времени, а не по времени приёма.
          Если не передано, используется время приёма
        format: date-time
        type: string
      fuel:
        type: number
      lat:
        description: |-
          Lat и Lon - указатели, чтобы отличить «не прислали» от нуля: без координат точка
          сохранялась бы как (0, 0), это Гвинейский залив
        type: number
      lon:
        type: number
      vehicle_id:
        type: integer
    type: object
  dto.TelemetryResponse:
    properties:
      device_id:
        type: integer
      distance_km:
        type: number
      fuel:
        type: number
      lat:
        type: number
      lon:
        type: number
      received_at:
        type: string
      speed_kmh:
        type: number
      telemetry_id:
        type: integer
      trip_id:
        type: integer
      vehicle_id:
        type: integer
    type: object
  dto.TripRequest:
    properties:
      driver_id:
        type: integer
      vehicle_id:
        type: integer
    type: object
  dto.UpdateAlertRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/model.AlertStatus'
        enum:
        - ACKNOWLEDGED
        example: ACKNOWLEDGED
    type: object
  dto.UpdateDriverRequest:
    properties:
      name:
        type: string
    type: object
  dto.UpdateTripRequest:
    properties:
      status:
        $ref: '#/definitions/model.TripStatus'
    type: object
  dto.UpdateVehicleRequest:
    properties:
      number_plate:
        type: string
      status:
        $ref: '#/definitions/model.VehicleStatus'
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      organization_id:
        type: integer
      role:
        $ref: '#/definitions/model.UserRole'
    type: object
  dto.VehicleResponse:
    properties:
      id:
        type: integer
      model:
        type: string
      number_plate:
        type: string
      organization_id:
        type: integer
      status:
        $ref: '#/definitions/model.VehicleStatus'
      vin:
        type: string
    type: object
  model.AlertRuleType:
    enum:
    - SPEED_EXCEEDED
    - DEVICE_OFFLINE
    - LOW_FUEL
    type: string
    x-enum-varnames:
    - AlertRuleSpeedExceed
    - AlertRuleDeviceOffline
    - AlertRuleLowFuel
  model.AlertStatus:
    enum:
    - FIRED
    - ACKNOWLEDGED
    - RESOLVED
    type: string
    x-enum-varnames:
    - AlertStatusFired
    - AlertStatusAcknowledged
    - AlertStatusResolved
  model.AuthResult:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  model.DeviceStatus:
    enum:
    - ACTIVE
    - INACTIVE
    - MAINTENANCE
    type: string
    x-enum-varnames:
    - DeviceStatusActive
    - DeviceStatusInactive
    - DeviceStatusMaintenance
  model.SeverityLevel:
    enum:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
    type: string
    x-enum-varnames:
    - SeverityLevelLow
    - SeverityLevelMedium
    - SeverityLevelHigh
    - SeverityLevelCritical
  model.Trip:
    properties:
      avg_speed_kmh:
        type: number
      distance_km:
        type: number
      driver_id:
        type: integer
      ended_at:
        type: string
      id:
        type: integer
      max_speed_kmh:
        type: number
      started_at:
        type: string
      status:
        $ref: '#/definitions/model.TripStatus'
      telemetry_count:
        type: integer
      vehicle_id:
        type: integer
    type: object
  model.TripStatus:
    enum:
    - RUNNING
    - CANCELLED
    - SUCCEEDED
    - SLEEPING
    - SERVING
    type: string
    x-enum-varnames:
    - TripStatusRunning
    - TripStatusCancelled
    - TripStatusSucceeded
    - TripStatusSleeping
    - TripStatusServing
  model.UserRole:
    enum:
    - ADMIN
    - DISPATCHER
    - DRIVER
    - ANALYTIC
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleDispatcher
    - UserRoleDriver
    - UserRoleAnalytic
  model.VehicleStatus:
    enum:
    - IDLE
    - ON_TRIP
    - IN_SERVICE
    - DELETED
    type: string
    x-enum-varnames:
    - VehicleStatusIdle
    - VehicleStatusOnTrip
    - VehicleStatusInService
    - VehicleStatusDeleted
host: localhost:8080
info:
  contact: {}
  description: Бэкенд системы мониторинга и телематики автопарка
  title: FleetTrack API
  version: "1.0"
paths:
  /alert-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AlertRuleResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список правил алертов организации
      tags:
      - alert-rules
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные правила
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AlertRuleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать правило алерта
      tags:
      - alert-rules
  /alert-rules/{id}:
    delete:
      parameters:
      - description: ID правила
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AlertRuleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить правило алерта
      tags:
      - alert-rules
    get:
      parameters:
      - description: ID правила
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AlertRuleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить правило алерта по ID
      tags:
      - alert-rules
  /alerts:
    get:
      parameters:
      - description: Статус алерта
        enum:
        - FIRED
        - ACKNOWLEDGED
        - RESOLVED
        in: query
        name: status
        type: string
      - description: Критичность
        enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
        in: query
        name: severity
        type: string
      - description: ID машины
        in: query
        name: vehicle_id
        type: integer
      - description: Алерты начиная с момента (RFC3339)
        format: date-time
        in: query
        name: created_from
        type: string
      - default: 100
        description: Максимум записей
        in: query
        maximum: 500
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Сколько записей пропустить
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AlertResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список алертов организации
      tags:
      - alerts
  /alerts/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID алерта
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус, поддерживается только ACKNOWLEDGED
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AlertResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: алерта нет или он принадлежит другой организации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: алерт уже принят или закрыт
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Принять алерт в работу
      tags:
      - alerts
  /assignments:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID устройства и автомобиля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssignmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AssignmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: устройство или автомобиль не найдены либо принадлежат другой
            организации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: устройство или автомобиль уже заняты
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Привязать трекер к автомобилю
      tags:
      - assignments
  /devices:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные устройства
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DeviceResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Зарегистрировать GPS-трекер
      tags:
      - devices
  /devices/{id}:
    delete:
      parameters:
      - description: ID устройства
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DeviceResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить трекер
      tags:
      - devices
    get:
      parameters:
      - description: ID устройства
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DeviceResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить трекер по ID
      tags:
      - devices
  /drivers:
    get:
      parameters:
      - description: Фильтр по имени
        in: query
        name: name
        type: string
      - description: От даты создания (RFC3339)
        in: query
        name: created_from
        type: string
      - description: До даты создания (RFC3339)
        in: query
        name: created_to
        type: string
      - description: Лимит записей (по умолчанию 100, максимум 500)
        in: query
        name: limit
        type: integer
      - description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.DriverResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список водителей организации
      tags:
      - drivers
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные водителя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDriverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DriverResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать профиль водителя
      tags:
      - drivers
  /drivers/{id}:
    delete:
      parameters:
      - description: ID водителя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DriverResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: у водителя есть рейсы, удаление невозможно
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить водителя
      tags:
      - drivers
    get:
      parameters:
