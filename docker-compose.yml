services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fleettrack-postgres-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD-SHELL", 
        "wget -qO- http://localhost:8080/readyz"
        ]
      interval: 6s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
    - "${DB_PORT}:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USER} -d ${DB_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.1
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/loadtest:ro
    environment:
      - BASE_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    command: ["run", "/loadtest/telemetry_ingest.js"]

  fleettrack-postgres-migrate:
    image: migrate/migrate:v4.19.1
    working_dir: /
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
